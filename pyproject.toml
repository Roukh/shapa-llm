[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shapa"
version = "0.6.0"
description = "Operational memory for an LLM agent - a self-healing markdown-graph memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Roukh" }]
keywords = ["llm", "agent", "memory", "obsidian", "markdown", "knowledge-graph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []  # core engine is pure standard library

[project.optional-dependencies]
# Activates local semantic embeddings for fetch + maintain (else BM25/Jaccard).
# `semantic` is the current name (shapa-backend-spec.md §3); `embeddings` is
# kept as a deprecated alias with identical deps for one release.
semantic = ["sentence-transformers>=2.2.0"]
embeddings = ["sentence-transformers>=2.2.0"]
# Reserved for the MCP stdio server (shapa-backend-spec.md §7.1, Slice 6) -
# no package pinned yet since shapa/mcp.py doesn't exist; `pip install
# shapa[mcp]` today installs the base package only. bootstrap.sh's extras
# prompt already offers it so the flag name is stable ahead of that slice.
mcp = []

[project.scripts]
shapa = "shapa.cli:main"

[project.urls]
Homepage = "https://github.com/Roukh/shapa-llm"
Repository = "https://github.com/Roukh/shapa-llm"

[tool.setuptools]
packages = ["shapa"]

[tool.setuptools.package-data]
# Design docs (arch/ + AGENTS.md) shipped with the tool and installed into a
# wiki by `shapa init`.
shapa = ["assets/*.md", "assets/arch/*.md"]
