[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shapa"
version = "0.9.0"
description = "Memory and a work ledger for coding agents, in one SQLite file per wiki, with harness hooks for Claude Code, Codex and OpenCode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Roukh" }]
keywords = [
    "llm",
    "agent",
    "memory",
    "coding-agent",
    "work-ledger",
    "sqlite",
    "claude-code",
    "codex",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
]
dependencies = []  # core engine is pure standard library

[project.optional-dependencies]
# Activates local semantic embeddings for fetch + maintain (else BM25/Jaccard).
# `semantic` is the current name (shapa-backend-spec.md §3); `embeddings` is
# kept as a deprecated alias with identical deps for one release. model2vec
# (potion-base-8M) replaces sentence-transformers as of Slice 6: numpy-only,
# no torch, ~94.7% of MiniLM's MTEB at a fraction of the install/latency cost.
semantic = ["model2vec>=0.3.0"]
embeddings = ["model2vec>=0.3.0"]
# The MCP stdio server (shapa/mcp.py, shapa-backend-spec.md §7.1, Slice 6).
# The official SDK is optional even with this extra installed: shapa/mcp.py
# falls back to a stdlib-only JSON-RPC shim (the same wire protocol a real
# MCP client speaks over stdio) whenever it is absent, so `shapa mcp` always
# works, extra or not - this just upgrades it to the reference SDK surface.
mcp = ["mcp>=1.0.0"]

[project.scripts]
shapa = "shapa.cli:main"

[project.urls]
Homepage = "https://github.com/Roukh/shapa-llm"
Repository = "https://github.com/Roukh/shapa-llm"
Issues = "https://github.com/Roukh/shapa-llm/issues"
Changelog = "https://github.com/Roukh/shapa-llm/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["shapa"]

[tool.setuptools.package-data]
# Design docs (arch/ + AGENTS.md) shipped with the tool and installed into a
# wiki by `shapa init`.
shapa = ["assets/*.md", "assets/arch/*.md", "assets/skills/*/SKILL.md", "assets/prompts/*.md"]
